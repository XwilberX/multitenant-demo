apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenant-alpha

resources:
  - ../base

patches:
  - target:
      kind: Namespace
      name: TENANT_SLUG
    patch: |
      - op: replace
        path: /metadata/name
        value: tenant-alpha
      - op: replace
        path: /metadata/labels/tenant
        value: alpha

  - target:
      kind: ConfigMap
      name: tenant-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: tenant-config
      data:
        config.yml: |
          slug: alpha
          branding:
            name: Alpha Corporation
            color: "#1d4ed8"
            logo_text: "△ ALPHA"
          payment_provider: stripe
          features:
            enable_advanced_dashboard: true

  - target:
      kind: Ingress
      name: tenant-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: alpha.demo.dotinfra.tech
      - op: replace
        path: /spec/rules/0/host
        value: alpha.demo.dotinfra.tech
